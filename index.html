<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 무브투유 - 판매 내역</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #f0fdfa 100%); }
        .brand-teal { color: #14b8a6; }
    </style>
</head>
<body class="min-h-screen pb-12">

<div class="max-w-2xl mx-auto px-5 pt-8">
    <!-- 헤더 -->
    <div class="bg-teal-600 text-white p-6 rounded-3xl text-center mb-8">
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl">🚚</div>
        </div>
        <h1 class="text-2xl font-bold">기아 무브투유</h1>
        <p class="text-teal-100">판매 내역 조회</p>
    </div>

    <!-- 필터 -->
    <div class="bg-white rounded-3xl p-5 shadow mb-6 space-y-4">
        <div>
            <p class="text-xs text-gray-500 mb-1">드라이버</p>
            <select id="driver-select" onchange="filterSales()" class="w-full border border-gray-300 rounded-2xl px-4 py-3">
                <option value="all">전체 드라이버</option>
            </select>
        </div>
        <div>
            <p class="text-xs text-gray-500 mb-1">날짜</p>
            <select id="date-select" onchange="filterSales()" class="w-full border border-gray-300 rounded-2xl px-4 py-3">
                <option value="all">전체 날짜</option>
            </select>
        </div>
    </div>

    <!-- 판매 내역 리스트 -->
    <div id="sales-list" class="bg-white rounded-3xl shadow overflow-hidden"></div>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/10uykAHPURqB0sv_yUBi4zSqiS6Z8uhRxl-pRmCcE4Ao/gviz/tq?tqx=out:json&gid=92272147";

let allRows = [];

async function loadData() {
    try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        allRows = json.table.rows;

        populateFilters();
        filterSales();
    } catch(e) {
        document.getElementById('sales-list').innerHTML = `<p class="text-red-500 p-8 text-center">데이터 불러오기 실패</p>`;
    }
}

function populateFilters() {
    const drivers = new Set();
    const dates = new Set();

    allRows.forEach(row => {
        if (row.c) {
            // 드라이버 (H열 ≈ index 7)
            if (row.c[7] && row.c[7].v) drivers.add(row.c[7].v);
            // 날짜 (B열 ≈ index 1)
            if (row.c[1] && row.c[1].v) dates.add(row.c[1].v);
        }
    });

    // 드라이버 옵션
    let driverHtml = '<option value="all">전체 드라이버</option>';
    [...drivers].sort().forEach(d => driverHtml += `<option value="${d}">${d}</option>`);
    document.getElementById('driver-select').innerHTML = driverHtml;

    // 날짜 옵션
    let dateHtml = '<option value="all">전체 날짜</option>';
    [...dates].sort().forEach(d => dateHtml += `<option value="${d}">${d}</option>`);
    document.getElementById('date-select').innerHTML = dateHtml;
}

function filterSales() {
    const selectedDriver = document.getElementById('driver-select').value;
    const selectedDate = document.getElementById('date-select').value;

    let html = `<div class="p-5 border-b"><p class="font-medium">판매 내역</p></div>`;
    let grandTotal = 0;
    let itemCount = 0;

    allRows.forEach(row => {
        if (!row.c || !row.c[5]) return;

        const date = row.c[1] ? row.c[1].v : '';
        const driver = row.c[7] ? row.c[7].v : '';
        const product = row.c[2] ? row.c[2].v : '상품명 없음';   // C열
        const qty = row.c[4] ? row.c[4].v : 0;                   // E열
        const amount = parseInt(row.c[5].v || 0);                // G열

        if (amount <= 0) return;

        const matchDriver = selectedDriver === 'all' || driver === selectedDriver;
        const matchDate = selectedDate === 'all' || date === selectedDate;

        if (matchDriver && matchDate) {
            grandTotal += amount;
            itemCount++;

            html += `
                <div class="p-5 border-b flex justify-between items-center">
                    <div>
                        <div class="font-medium">${product}</div>
                        <div class="text-sm text-gray-500">${qty}개</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold">${amount.toLocaleString()}원</div>
                    </div>
                </div>`;
        }
    });

    html += `
        <div class="p-6 bg-gray-50 rounded-b-3xl">
            <div class="flex justify-between text-lg">
                <span class="font-medium">총계</span>
                <span class="font-bold">${grandTotal.toLocaleString()}원</span>
            </div>
            <div class="text-xs text-gray-500 mt-1">${itemCount}개 상품</div>
        </div>`;

    document.getElementById('sales-list').innerHTML = html;
}

window.onload = loadData;
</script>
</body>
</html>
