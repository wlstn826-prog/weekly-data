<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 무브투유</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #f0fdfa 100%); }
    </style>
</head>
<body class="min-h-screen pb-12">

<div class="max-w-2xl mx-auto px-5 pt-8">
    <div class="bg-teal-600 text-white p-6 rounded-3xl text-center mb-8">
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl">🚚</div>
        </div>
        <h1 class="text-2xl font-bold">기아 무브투유</h1>
        <p class="text-teal-100">판매 & 운행일지 조회</p>
    </div>

    <div class="bg-white rounded-3xl p-5 shadow mb-8 grid grid-cols-2 gap-4">
        <div>
            <p class="text-xs text-gray-500 mb-1">드라이버</p>
            <select id="driver-select" onchange="filterAll()" class="w-full border border-gray-300 rounded-2xl px-4 py-3">
                <option value="all">전체</option>
                <option value="우정현">우정현</option>
                <option value="양태주">양태주</option>
                <option value="이진수">이진수</option>
            </select>
        </div>
        <div>
            <p class="text-xs text-gray-500 mb-1">날짜</p>
            <input type="date" id="date-select" onchange="filterAll()" class="w-full border border-gray-300 rounded-2xl px-4 py-3">
        </div>
    </div>

    <div class="flex border-b mb-6">
        <button onclick="switchTab(0)" id="tab0" class="flex-1 py-4 font-medium border-b-2 border-teal-600 text-teal-600">판매 내역</button>
        <button onclick="switchTab(1)" id="tab1" class="flex-1 py-4 font-medium text-gray-500">운행 일지</button>
    </div>

    <div id="content" class="bg-white rounded-3xl shadow min-h-[400px] p-6"></div>
</div>

<script>
const SALES_URL = "https://docs.google.com/spreadsheets/d/10uykAHPURqB0sv_yUBi4zSqiS6Z8uhRxl-pRmCcE4Ao/gviz/tq?tqx=out:json&gid=92272147";
const LOG_URL = "https://docs.google.com/spreadsheets/d/10uykAHPURqB0sv_yUBi4zSqiS6Z8uhRxl-pRmCcE4Ao/gviz/tq?tqx=out:json&gid=0";

async function loadData() {
    document.getElementById('content').innerHTML = `<p class="text-center py-20">데이터 불러오는 중...</p>`;
    
    try {
        const [sRes, lRes] = await Promise.all([fetch(SALES_URL), fetch(LOG_URL)]);
        
        if (!sRes.ok) throw new Error("판매 시트 접근 실패");
        if (!lRes.ok) throw new Error("운행일지 시트 접근 실패");

        const sText = await sRes.text();
        const lText = await lRes.text();

        const salesData = JSON.parse(sText.substring(47).slice(0, -2));
        const logData = JSON.parse(lText.substring(47).slice(0, -2));

        window.salesRows = salesData.table.rows;
        window.logRows = logData.table.rows;

        filterAll();
    } catch(e) {
        document.getElementById('content').innerHTML = `
            <p class="text-red-500 text-center py-12">❌ 데이터 불러오기 실패</p>
            <p class="text-center text-sm text-gray-500">${e.message}</p>
        `;
        console.error(e);
    }
}

function switchTab(n) {
    document.getElementById('tab0').classList.toggle('border-teal-600', n === 0);
    document.getElementById('tab0').classList.toggle('text-teal-600', n === 0);
    document.getElementById('tab1').classList.toggle('border-teal-600', n === 1);
    document.getElementById('tab1').classList.toggle('text-teal-600', n === 1);
    filterAll();
}

function filterAll() {
    const driver = document.getElementById('driver-select').value;
    const dateInput = document.getElementById('date-select').value;
    const isSales = document.getElementById('tab0').classList.contains('border-teal-600');

    if (isSales) renderSales(driver, dateInput);
    else renderLog(driver, dateInput);
}

function renderSales(driver, dateInput) {
    let html = `<div class="p-5 border-b font-medium">판매 내역</div>`;
    let total = 0, count = 0;

    (window.salesRows || []).forEach(row => {
        if (!row.c || !row.c[5]) return;
        const dateStr = row.c[1] ? String(row.c[1].v) : '';
        const rowDriver = row.c[7] ? String(row.c[7].v) : '';
        const product = row.c[2] ? row.c[2].v : '';
        const qty = row.c[4] ? row.c[4].v : 0;
        const amount = parseInt(row.c[5].v || 0);

        if (amount <= 0) return;

        const driverMatch = driver === "all" || rowDriver === driver;
        let dateMatch = true;
        if (dateInput) {
            const [y,m,d] = dateInput.split('-');
            dateMatch = dateStr.includes(`${parseInt(m)}/${parseInt(d)}`);
        }

        if (driverMatch && dateMatch) {
            total += amount;
            count++;
            html += `
                <div class="p-5 border-b flex justify-between">
                    <div><div class="font-medium">${product}</div><div class="text-sm text-gray-500">${qty}개</div></div>
                    <div class="font-bold">${amount.toLocaleString()}원</div>
                </div>`;
        }
    });

    document.getElementById('content').innerHTML = html || `<p class="p-12 text-center text-gray-400">데이터가 없습니다.</p>`;
}

function renderLog(driver, dateInput) {
    document.getElementById('content').innerHTML = `<p class="p-12 text-center text-gray-400">운행 일지 불러오는 중...</p>`;
}

window.onload = loadData;
</script>
</body>
</html>
