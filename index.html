<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 무브투유 - 지난주 리뷰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #f0fdfa 100%); }
        .brand-teal { color: #14b8a6; }
        .day-tab { transition: all 0.2s; }
        .day-tab.active { background-color: #14b8a6; color: white; }
    </style>
</head>
<body class="min-h-screen pb-12">

<div class="max-w-2xl mx-auto px-5 pt-8">
    <div class="bg-teal-600 text-white p-6 rounded-3xl text-center mb-8">
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl">🚚</div>
        </div>
        <h1 class="text-2xl font-bold">기아 무브투유</h1>
        <p class="text-teal-100">지난주 판매 리뷰</p>
    </div>

    <!-- 요일 선택 -->
    <div class="grid grid-cols-7 gap-2 mb-8" id="day-tabs"></div>

    <div id="content" class="bg-white rounded-3xl p-6 shadow"></div>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/10uykAHPURqB0sv_yUBi4zSqiS6Z8uhRxl-pRmCcE4Ao/gviz/tq?tqx=out:json&gid=92272147";

const days = ['월','화','수','목','금','토','일'];

async function loadAndRender() {
    try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;

        // 날짜 파싱 및 요일별 그룹핑
        const salesByDay = { '월':[], '화':[], '수':[], '목':[], '금':[], '토':[], '일':[] };

        rows.forEach(row => {
            if (!row.c || !row.c[0]) return;
            const dateStr = row.c[0].v;           // B열: 날짜 (예: 3/9(월))
            const amount = row.c[5] ? parseInt(row.c[5].v || 0) : 0;

            if (amount > 0 && dateStr) {
                const dayChar = dateStr.match(/[월화수목금토일]/);
                if (dayChar) {
                    const day = dayChar[0];
                    salesByDay[day].push(amount);
                }
            }
        });

        renderDayTabs(salesByDay);
        renderDay('월', salesByDay);   // 기본 월요일

    } catch(e) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 text-center py-12">데이터 불러오기 실패</p>`;
    }
}

function renderDayTabs(salesByDay) {
    let html = '';
    days.forEach(day => {
        const total = salesByDay[day].reduce((a,b)=>a+b, 0);
        html += `
            <div onclick="renderDay('${day}', ${JSON.stringify(salesByDay)})" 
                 class="day-tab text-center py-3 bg-white rounded-2xl font-medium cursor-pointer border border-gray-200">
                ${day}<br>
                <span class="text-xs text-teal-600">${Math.round(total/10000)}만</span>
            </div>`;
    });
    document.getElementById('day-tabs').innerHTML = html;
}

function renderDay(selectedDay, salesByDay) {
    document.querySelectorAll('.day-tab').forEach(el => el.classList.remove('active'));
    
    const total = salesByDay[selectedDay].reduce((a,b)=>a+b, 0);
    const count = salesByDay[selectedDay].length;

    document.getElementById('content').innerHTML = `
        <div class="text-center">
            <p class="text-teal-600 font-medium">${selectedDay}요일 판매</p>
            <p class="text-6xl font-bold mt-3">${Math.round(total/10000)}만원</p>
            <p class="text-gray-500">${count}건 판매</p>
        </div>
    `;
}

window.onload = loadAndRender;
</script>
</body>
</html>
