<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 무브투유</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #f0fdfa 100%); }
    </style>
</head>
<body class="min-h-screen pb-12">

<div class="max-w-2xl mx-auto px-5 pt-8">
    <!-- 상단 헤더 -->
    <div class="bg-teal-600 text-white p-6 rounded-3xl text-center mb-8">
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl">🚚</div>
        </div>
        <h1 class="text-2xl font-bold">기아 무브투유</h1>
        <p class="text-teal-100">판매 내역 조회</p>
    </div>

    <!-- 필터 -->
    <div class="bg-white rounded-3xl p-5 shadow mb-8 grid grid-cols-2 gap-4">
        <div>
            <p class="text-xs text-gray-500 mb-1">드라이버</p>
            <select id="driver-select" onchange="filterAll()" class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-base">
                <option value="all">전체</option>
                <option value="우정현">우정현</option>
                <option value="양태주">양태주</option>
                <option value="이진수">이진수</option>
            </select>
        </div>
        <div>
            <p class="text-xs text-gray-500 mb-1">날짜</p>
            <input type="date" id="date-select" onchange="filterAll()" class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-base">
        </div>
    </div>

    <!-- 큰 탭 버튼 -->
    <div class="grid grid-cols-2 gap-3 mb-8">
        <button onclick="switchTab(0)" id="tab-sales" 
                class="py-6 bg-white rounded-3xl shadow text-lg font-medium border-2 border-teal-600 text-teal-600">
            판매 내역
        </button>
        <button onclick="switchTab(1)" id="tab-log" 
                class="py-6 bg-white rounded-3xl shadow text-lg font-medium">
            운행 일지
        </button>
    </div>

    <!-- 내용 영역 -->
    <div id="content" class="bg-white rounded-3xl shadow min-h-[400px] p-6"></div>
</div>

<script>
// ... (데이터 로드 및 filterAll, renderSales, renderLog 함수는 이전과 동일하게 유지)
const SHEET_URL = "https://docs.google.com/spreadsheets/d/10uykAHPURqB0sv_yUBi4zSqiS6Z8uhRxl-pRmCcE4Ao/gviz/tq?tqx=out:json&gid=92272147";

let salesRows = [];

async function loadData() {
    try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        salesRows = JSON.parse(text.substring(47).slice(0, -2)).table.rows;
        filterAll();
    } catch(e) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 p-12 text-center">데이터 로드 실패</p>`;
    }
}

function switchTab(n) {
    document.getElementById('tab-sales').classList.toggle('border-teal-600', n === 0);
    document.getElementById('tab-sales').classList.toggle('text-teal-600', n === 0);
    document.getElementById('tab-log').classList.toggle('border-teal-600', n === 1);
    document.getElementById('tab-log').classList.toggle('text-teal-600', n === 1);
    
    filterAll();
}

function filterAll() {
    const driver = document.getElementById('driver-select').value;
    const dateInput = document.getElementById('date-select').value;
    
    const isSales = document.getElementById('tab-sales').classList.contains('border-teal-600');
    
    if (isSales) renderSales(driver, dateInput);
    else renderLog(driver, dateInput);   // 운행일지는 아직 준비중
}

function renderSales(driver, dateInput) {
    // 판매 내역 렌더링 (이전 코드와 동일)
    let html = `<div class="text-center py-20 text-gray-400">판매 내역 불러오는 중...</div>`;
    document.getElementById('content').innerHTML = html;
}

function renderLog(driver, dateInput) {
    let html = `<div class="text-center py-20 text-gray-400">운행 일지 불러오는 중...</div>`;
    document.getElementById('content').innerHTML = html;
}

window.onload = loadData;
</script>
</body>
</html>
