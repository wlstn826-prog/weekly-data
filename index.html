<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 무브투유 - 판매 내역</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #f0fdfa 100%); }
    </style>
</head>
<body class="min-h-screen pb-12">

<div class="max-w-2xl mx-auto px-5 pt-8">
    <div class="bg-teal-600 text-white p-6 rounded-3xl text-center mb-8">
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl">🚚</div>
        </div>
        <h1 class="text-2xl font-bold">기아 무브투유</h1>
        <p class="text-teal-100">판매 내역 조회</p>
    </div>

    <div class="bg-white rounded-3xl p-5 shadow mb-6 grid grid-cols-2 gap-4">
        <div>
            <p class="text-xs text-gray-500 mb-1">드라이버</p>
            <select id="driver-select" onchange="filterSales()" class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-base">
                <option value="all">전체</option>
                <option value="우정현">우정현</option>
                <option value="양태주">양태주</option>
                <option value="이진수">이진수</option>
            </select>
        </div>
        <div>
            <p class="text-xs text-gray-500 mb-1">날짜</p>
            <input type="date" id="date-select" onchange="filterSales()" class="w-full border border-gray-300 rounded-2xl px-4 py-3 text-base">
        </div>
    </div>

    <div id="sales-list" class="bg-white rounded-3xl shadow min-h-[400px] p-5"></div>
</div>

<script>
function filterSales() {
    const driver = document.getElementById('driver-select').value;
    const dateInput = document.getElementById('date-select').value;
    
    let html = `<div class="text-center py-10">`;
    
    if (driver === "all" && !dateInput) {
        html += `<p class="text-gray-400">드라이버와 날짜를 선택해주세요</p>`;
    } else {
        html += `
            <p class="text-lg font-medium">${driver === "all" ? "전체" : driver} 드라이버</p>
            <p class="text-sm text-gray-500">${dateInput || "전체 날짜"}</p>
            <p class="mt-8 text-2xl font-bold text-teal-600">데이터 불러오는 중...</p>
        `;
    }
    
    html += `</div>`;
    document.getElementById('sales-list').innerHTML = html;
}

// 페이지 로드
window.onload = filterSales;
</script>
</body>
</html>
