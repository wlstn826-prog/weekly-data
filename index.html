<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 무브투유 - 판매 & 운행일지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #f0fdfa 100%); }
        .brand-teal { color: #14b8a6; }
        .tab-active { border-bottom: 3px solid #14b8a6; color: #14b8a6; font-weight: 700; }
    </style>
</head>
<body class="min-h-screen pb-12">

<div class="max-w-2xl mx-auto px-5 pt-8">
    <!-- 헤더 -->
    <div class="bg-teal-600 text-white p-6 rounded-3xl text-center mb-8">
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl">🚚</div>
        </div>
        <h1 class="text-2xl font-bold">기아 무브투유</h1>
        <p class="text-teal-100">판매 & 운행일지 조회</p>
    </div>

    <!-- 필터 -->
    <div class="bg-white rounded-3xl p-5 shadow mb-6 grid grid-cols-2 gap-4">
        <div>
            <p class="text-xs text-gray-500 mb-1">드라이버</p>
            <select id="driver-select" onchange="filterAll()" class="w-full border border-gray-300 rounded-2xl px-4 py-3"></select>
        </div>
        <div>
            <p class="text-xs text-gray-500 mb-1">날짜</p>
            <input type="date" id="date-select" onchange="filterAll()" class="w-full border border-gray-300 rounded-2xl px-4 py-3">
        </div>
    </div>

    <!-- 탭 -->
    <div class="flex border-b mb-6">
        <button onclick="switchTab(0)" id="tab0" class="tab-active flex-1 py-3">판매 내역</button>
        <button onclick="switchTab(1)" id="tab1" class="flex-1 py-3 text-gray-500">운행 일지</button>
    </div>

    <!-- 내용 -->
    <div id="content"></div>
</div>

<script>
// ==================== 데이터 URL ====================
const SALES_URL = "https://docs.google.com/spreadsheets/d/10uykAHPURqB0sv_yUBi4zSqiS6Z8uhRxl-pRmCcE4Ao/gviz/tq?tqx=out:json&gid=92272147"; // 3-1 판매
const LOG_URL   = "https://docs.google.com/spreadsheets/d/10uykAHPURqB0sv_yUBi4zSqiS6Z8uhRxl-pRmCcE4Ao/gviz/tq?tqx=out:json&gid=0";     // 1) 운행일지 (gid 확인 필요)

let salesRows = [], logRows = [];

// ==================== 로드 ====================
async function loadAllData() {
    try {
        const [sRes, lRes] = await Promise.all([fetch(SALES_URL), fetch(LOG_URL)]);
        const sText = await sRes.text();
        const lText = await lRes.text();

        salesRows = JSON.parse(sText.substring(47).slice(0, -2)).table.rows;
        logRows = JSON.parse(lText.substring(47).slice(0, -2)).table.rows;

        populateDrivers();
        filterAll();
    } catch(e) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 p-12 text-center">데이터 로드 실패</p>`;
    }
}

// ==================== 드라이버 필터 ====================
function populateDrivers() {
    const drivers = new Set();
    salesRows.forEach(r => { if (r.c && r.c[7]) drivers.add(r.c[7].v); });
    logRows.forEach(r => { if (r.c && r.c[2]) drivers.add(r.c[2].v); });

    let html = '<option value="all">전체 드라이버</option>';
    [...drivers].sort().forEach(d => html += `<option value="${d}">${d}</option>`);
    document.getElementById('driver-select').innerHTML = html;
}

// ==================== 탭 전환 ====================
function switchTab(n) {
    document.getElementById('tab0').classList.toggle('tab-active', n === 0);
    document.getElementById('tab1').classList.toggle('tab-active', n === 1);
    filterAll();
}

// ==================== 필터링 ====================
function filterAll() {
    const selDriver = document.getElementById('driver-select').value;
    const selDate = document.getElementById('date-select').value;

    const activeTab = document.getElementById('tab0').classList.contains('tab-active') ? 0 : 1;

    if (activeTab === 0) renderSales(selDriver, selDate);
    else renderLog(selDriver, selDate);
}

// ==================== 1. 판매 내역 (카테고리 그룹핑) ====================
function renderSales(selDriver, selDate) {
    // ... (판매 내역 카테고리 그룹핑 로직 - 필요시 더 추가)
    let html = `<div class="p-5 border-b font-medium">판매 내역</div>`;
    // (기존 판매 로직 유지하면서 카테고리 그룹핑 추가 예정)
    document.getElementById('content').innerHTML = html + `<p class="p-12 text-center text-gray-400">판매 내역 카테고리 그룹핑 준비중...</p>`;
}

// ==================== 2. 운행 일지 ====================
function renderLog(selDriver, selDate) {
    let html = `<div class="p-5 border-b font-medium">운행 일지</div>`;
    let found = 0;

    logRows.forEach(row => {
        if (!row.c) return;
        const date = row.c[1] ? String(row.c[1].v) : '';
        const driver = row.c[2] ? row.c[2].v : '';

        const driverMatch = selDriver === "all" || driver === selDriver;
        const dateMatch = !selDate || date.includes(selDate.replace(/-/g, '/').slice(5));

        if (driverMatch && dateMatch) {
            found++;
            html += `
                <div class="p-5 border-b">
                    <div class="flex justify-between">
                        <div>
                            <span class="font-medium">${row.c[4] ? row.c[4].v : ''}</span> 
                            <span class="text-sm text-gray-500">(${row.c[3] ? row.c[3].v : ''})</span>
                        </div>
                        <div class="text-sm text-teal-600">${row.c[7] ? row.c[7].v : ''}</div>
                    </div>
                    <div class="mt-3 grid grid-cols-2 gap-4 text-sm">
                        <div>상주인원: <span class="font-medium">${row.c[5] ? row.c[5].v : '0'}</span></div>
                        <div>마트고객: <span class="font-medium">${row.c[6] ? row.c[6].v : '0'}</span></div>
                    </div>
                    ${row.c[8] ? `<div class="mt-3 text-orange-600">요청: ${row.c[8].v}</div>` : ''}
                    ${row.c[9] ? `<div class="text-red-600">품절: ${row.c[9].v}</div>` : ''}
                    ${row.c[10] ? `<div class="text-teal-600">다음주 참고: ${row.c[10].v}</div>` : ''}
                </div>`;
        }
    });

    if (found === 0) html += `<div class="p-12 text-center text-gray-400">조건에 맞는 운행일지가 없습니다.</div>`;

    document.getElementById('content').innerHTML = html;
}

window.onload = loadData;
</script>
</body>
</html>
