<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 무브투유</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #f0fdfa 100%); }
    </style>
</head>
<body class="min-h-screen pb-12">

<div class="max-w-2xl mx-auto px-5 pt-8">
    <div class="bg-teal-600 text-white p-6 rounded-3xl text-center mb-8">
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl">🚚</div>
        </div>
        <h1 class="text-2xl font-bold">기아 무브투유</h1>
        <p class="text-teal-100">판매 내역 조회</p>
    </div>

    <!-- 필터 -->
    <div class="bg-white rounded-3xl p-5 shadow mb-8 grid grid-cols-2 gap-4">
        <div>
            <p class="text-xs text-gray-500 mb-1">드라이버 (H열)</p>
            <select id="driver-select" onchange="filterSales()" class="w-full border border-gray-300 rounded-2xl px-4 py-3">
                <option value="all">전체</option>
                <option value="우정현">우정현</option>
                <option value="양태주">양태주</option>
                <option value="이진수">이진수</option>
            </select>
        </div>
        <div>
            <p class="text-xs text-gray-500 mb-1">날짜 (B열)</p>
            <input type="date" id="date-select" onchange="filterSales()" class="w-full border border-gray-300 rounded-2xl px-4 py-3">
        </div>
    </div>

    <div id="sales-list" class="bg-white rounded-3xl shadow"></div>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/10uykAHPURqB0sv_yUBi4zSqiS6Z8uhRxl-pRmCcE4Ao/gviz/tq?tqx=out:json&gid=92272147";

let allRows = [];

async function loadData() {
    try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        allRows = json.table.rows;
        filterSales();   // 초기 로드
    } catch(e) {
        document.getElementById('sales-list').innerHTML = `<p class="text-red-500 p-12 text-center">데이터 로드 실패</p>`;
    }
}

function filterSales() {
    const selDriver = document.getElementById('driver-select').value;
    const selDate = document.getElementById('date-select').value;   // YYYY-MM-DD

    let html = `<div class="p-5 border-b font-medium">판매 내역</div>`;
    let grandTotal = 0;
    let itemCount = 0;

    allRows.forEach(row => {
        if (!row.c || !row.c[5]) return;

        const dateStr = row.c[1] ? String(row.c[1].v) : '';     // B열 = 날짜
        const driver  = row.c[7] ? String(row.c[7].v) : '';     // H열 = 드라이버
        const product = row.c[2] ? row.c[2].v : '상품명 없음';
        const qty     = row.c[4] ? row.c[4].v : 0;
        const amount  = parseInt(row.c[5].v || 0);              // G열 = 판매금액

        if (amount <= 0) return;

        // 드라이버 필터
        const driverMatch = (selDriver === "all") || (driver === selDriver);

        // 날짜 필터
        let dateMatch = true;
        if (selDate) {
            const [year, month, day] = selDate.split('-').map(Number);
            const date1 = `${month}/${day}`;           // 5/6
            const date2 = `${month.toString().padStart(2,'0')}/${day.toString().padStart(2,'0')}`; // 05/06
            dateMatch = dateStr.includes(date1) || dateStr.includes(date2);
        }

        if (driverMatch && dateMatch) {
            grandTotal += amount;
            itemCount++;

            html += `
                <div class="p-5 border-b flex justify-between items-start">
                    <div class="flex-1">
                        <div class="font-medium">${product}</div>
                        <div class="text-sm text-gray-500">${qty}개</div>
                    </div>
                    <div class="font-bold text-right">${amount.toLocaleString()}원</div>
                </div>`;
        }
    });

    if (itemCount === 0) {
        html += `<div class="p-12 text-center text-gray-400">조건에 맞는 판매 내역이 없습니다.</div>`;
    } else {
        html += `
            <div class="p-6 bg-teal-50 rounded-b-3xl flex justify-between text-xl font-bold">
                <span>총 ${itemCount}건</span>
                <span>${grandTotal.toLocaleString()}원</span>
            </div>`;
    }

    document.getElementById('sales-list').innerHTML = html;
}

window.onload = loadData;
</script>
</body>
</html>
